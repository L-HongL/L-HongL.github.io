colorScheme = "blowfish"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true

showReadingTime = true
showTableOfContents = true
showAuthor = true

[homepage]
  layout = "profile"
  showRecent = true
  showRecentItems = 10

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = true
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showHeadingAnchors = true
  showPagination = true
  showEdit = false
  showLikes = false
  showComments = false

[assets]
  disableHLJS = true